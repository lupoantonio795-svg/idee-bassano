<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bassano da Scoprire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f9f6f1;--surface:#fff;--surface2:#f2ece3;--border:rgba(0,0,0,0.09);
  --text:#1e1a14;--muted:#6e6660;--faint:#b5b0aa;
  /* Palette Bassano: terracotta, verde Brenta, oro */
  --primary:#9b3a1a;--primary-light:#fdf0ec;--primary-hover:#7a2d13;
  --green:#3a6b3a;--green-light:#eaf3ea;--green-hover:#2d5430;
  --blue:#2a5c8a;--blue-light:#e8f1f8;
  --orange:#c47a1a;--orange-light:#fdf4e3;
  --violet:#6b3fa0;--violet-light:#f3edfb;
  --coral:#b84040;--coral-light:#fdeaea;
  --gold:#a07820;--gold-light:#faf3e0;
  --radius:1rem;
  --shadow:0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.13);
}
[data-theme=dark]{
  --bg:#130f0b;--surface:#1c1814;--surface2:#231e18;--border:rgba(255,255,255,0.09);
  --text:#e8e2da;--muted:#918c84;--faint:#57524c;
  --primary:#d4714a;--primary-light:#2a1510;--primary-hover:#b85c38;
  --green:#5aaa5a;--green-light:#182818;--green-hover:#489048;
  --blue:#5b90c7;--blue-light:#141f2e;
  --orange:#d4942a;--orange-light:#251a08;
  --violet:#a87ed4;--violet-light:#1e1228;
  --coral:#e06060;--coral-light:#2a1010;
  --gold:#c8a040;--gold-light:#201a08;
  --shadow:0 2px 12px rgba(0,0,0,0.35);--shadow-lg:0 8px 32px rgba(0,0,0,0.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.logo{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:.5rem;color:var(--primary)}
.nav-right{display:flex;align-items:center;gap:.75rem}
.btn-add{background:var(--primary);color:#fff;padding:.45rem 1.1rem;border-radius:2rem;font-size:.85rem;font-weight:600;transition:background .18s}
.btn-add:hover{background:var(--primary-hover)}
.btn-theme{padding:.4rem;border-radius:2rem;border:1.5px solid var(--border);display:flex;align-items:center;transition:background .18s}
.btn-theme:hover{background:var(--surface2)}

/* HERO vecchio 
.hero{background:linear-gradient(135deg,#9b3a1a 0%,#c47a1a 50%,#3a6b3a 100%);color:#fff;padding:2.5rem 1.5rem 3rem;text-align:center;position:relative;overflow:hidden}

.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:.5rem;position:relative}
.hero p{opacity:.9;font-size:1rem;max-width:48ch;margin:0 auto;position:relative}
.hero-sub{display:flex;justify-content:center;gap:1.5rem;margin-top:1.25rem;position:relative;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.15);backdrop-filter:blur(4px);padding:.35rem .9rem;border-radius:2rem;font-size:.8rem;font-weight:600}
*/
  /* HERO */
.hero{
  background: linear-gradient(rgba(0,0,0,0.40), rgba(0,0,0,0.40)),
              url('hero.jpg') center/cover no-repeat;
  color:#fff;
  padding:2.5rem 1.5rem 3rem;
  text-align:center;
  position:relative;
  overflow:hidden;
  min-height:280px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:.5rem;position:relative}
.hero p{opacity:.9;font-size:1rem;max-width:48ch;margin:0 auto;position:relative}
.hero-sub{display:flex;justify-content:center;gap:1.5rem;margin-top:1.25rem;position:relative;flex-wrap:wrap}
.hero-pill{background:rgba(255,255,255,.15);backdrop-filter:blur(4px);padding:.35rem .9rem;border-radius:2rem;font-size:.8rem;font-weight:600}

  /* FILTERS */
.filters{max-width:1150px;margin:0 auto;padding:1.75rem 1.5rem .5rem;display:flex;gap:.6rem;flex-wrap:wrap}
.filter-btn{padding:.5rem 1.1rem;border-radius:2rem;border:1.5px solid var(--border);font-size:.85rem;font-weight:500;background:var(--surface);transition:all .18s;white-space:nowrap}
.filter-btn.active[data-filter="all"],.filter-btn[data-filter="all"]:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.filter-btn.active[data-filter="visitare"],.filter-btn[data-filter="visitare"]:hover{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.filter-btn.active[data-filter="mangiare"],.filter-btn[data-filter="mangiare"]:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.filter-btn.active[data-filter="trekking"],.filter-btn[data-filter="trekking"]:hover{border-color:var(--green);background:var(--green-light);color:var(--green)}
.filter-btn.active[data-filter="trekking-medio"],.filter-btn[data-filter="trekking-medio"]:hover{border-color:var(--orange);background:var(--orange-light);color:var(--orange)}
.filter-btn.active[data-filter="bici"],.filter-btn[data-filter="bici"]:hover{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.filter-btn.active[data-filter="picnic"],.filter-btn[data-filter="picnic"]:hover{border-color:var(--violet);background:var(--violet-light);color:var(--violet)}
.filter-btn.active[data-filter="adventure"],.filter-btn[data-filter="adventure"]:hover{border-color:var(--coral);background:var(--coral-light);color:var(--coral)}
.filter-btn.active[data-filter="prodotti"],.filter-btn[data-filter="prodotti"]:hover{border-color:var(--gold);background:var(--gold-light);color:var(--gold)}

/* GRID */
.grid{max-width:1150px;margin:0 auto;padding:1rem 1.5rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.25rem}

/* CARD */
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-img{aspect-ratio:16/9;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-img img{transform:scale(1.04)}
.cat-badge{position:absolute;top:.7rem;left:.7rem;padding:.25rem .65rem;border-radius:2rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;backdrop-filter:blur(8px)}
.badge-visitare{background:rgba(42,92,138,.85);color:#fff}
.badge-mangiare{background:rgba(155,58,26,.85);color:#fff}
.badge-trekking{background:rgba(58,107,58,.85);color:#fff}
.badge-trekking-medio{background:rgba(196,122,26,.85);color:#fff}
.badge-bici{background:rgba(42,92,138,.85);color:#fff}
.badge-picnic{background:rgba(107,63,160,.85);color:#fff}
.badge-adventure{background:rgba(184,64,64,.85);color:#fff}
.badge-prodotti{background:rgba(160,120,32,.85);color:#fff}
.card-body{padding:1rem 1.1rem 1.1rem}
.card-cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:.3rem}
.text-visitare{color:var(--blue)}
.text-mangiare{color:var(--primary)}
.text-trekking{color:var(--green)}
.text-trekking-medio{color:var(--orange)}
.text-bici{color:var(--blue)}
.text-picnic{color:var(--violet)}
.text-adventure{color:var(--coral)}
.text-prodotti{color:var(--gold)}
.card-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;line-height:1.3;margin-bottom:.35rem}
.card-desc{font-size:.82rem;color:var(--muted);line-height:1.55;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.card-meta{display:flex;gap:.5rem;flex-wrap:wrap}
.tag{font-size:.7rem;padding:.2rem .55rem;background:var(--surface2);border-radius:2rem;color:var(--muted)}
.like-btn{display:flex;align-items:center;gap:.4rem;padding:.35rem .85rem;border-radius:2rem;border:1.5px solid var(--border);font-size:.85rem;font-weight:600;transition:all .18s;background:var(--surface);white-space:nowrap}
.like-btn:hover{border-color:#e55;background:#fff0f0}
.like-btn.liked{border-color:#e55;background:#fff0f0;color:#e55}
.like-btn .heart{font-size:.95rem;transition:transform .15s}
.like-btn:active .heart{transform:scale(1.4)}
.empty{text-align:center;padding:4rem 1.5rem;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:3rem;margin-bottom:1rem}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:1.5rem;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative}
.modal-img{aspect-ratio:16/9;overflow:hidden;border-radius:1.5rem 1.5rem 0 0}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:1.5rem}
.modal-cat{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:.35rem}
.modal-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;margin-bottom:.6rem;line-height:1.2}
.modal-desc{color:var(--muted);font-size:.92rem;line-height:1.7;margin-bottom:1rem}
.modal-info{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.info-chip{font-size:.8rem;padding:.3rem .7rem;background:var(--surface2);border-radius:2rem;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:1rem}
.gallery img{border-radius:.5rem;aspect-ratio:4/3;object-fit:cover;width:100%;cursor:pointer;transition:opacity .18s}
.gallery img:hover{opacity:.82}
.highlights-box{background:var(--surface2);border-radius:.75rem;padding:1rem;margin-bottom:1rem}
.highlights-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);margin-bottom:.5rem}
.highlights-list{list-style:none;display:flex;flex-direction:column;gap:.4rem}
.highlights-list li{font-size:.85rem}
.links-box{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}
.link-chip{padding:.5rem .85rem;border-radius:.6rem;border:1.5px solid var(--border);font-size:.8rem;font-weight:600;background:var(--surface2);transition:background .18s;white-space:nowrap}
.link-chip:hover{background:var(--border)}
.modal-actions{display:flex;gap:.75rem}
.modal-like{flex:1;padding:.7rem;border-radius:2rem;font-weight:600;font-size:.9rem;border:1.5px solid var(--border);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:.4rem}
.modal-like:hover,.modal-like.liked{border-color:#e55;background:#fff0f0;color:#e55}
.modal-maps{flex:1;padding:.7rem;border-radius:2rem;font-weight:600;font-size:.9rem;background:var(--primary);color:#fff;text-align:center;display:flex;align-items:center;justify-content:center;gap:.4rem;transition:background .18s}
.modal-maps:hover{background:var(--primary-hover)}
.close-btn{position:absolute;top:.9rem;right:.9rem;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);border-radius:2rem;padding:.4rem;display:flex;box-shadow:var(--shadow);transition:background .18s}
.close-btn:hover{background:#fff}

/* FORM */
.form-modal{background:var(--surface);border-radius:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:1.75rem}
.form-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;margin-bottom:1.25rem}
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{border:1.5px solid var(--border);border-radius:.6rem;padding:.6rem .85rem;font:inherit;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;transition:border-color .18s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:80px}
.form-actions{display:flex;gap:.75rem;margin-top:1.25rem}
.btn-submit{flex:1;padding:.7rem;border-radius:2rem;background:var(--primary);color:#fff;font-weight:600;font-size:.9rem;transition:background .18s}
.btn-submit:hover{background:var(--primary-hover)}
.btn-cancel{flex:1;padding:.7rem;border-radius:2rem;border:1.5px solid var(--border);font-weight:600;font-size:.9rem;transition:background .18s}
.btn-cancel:hover{background:var(--surface2)}

@media(max-width:500px){
  nav{padding:0 1rem}
  .grid{padding:1rem 1rem 3rem}
  .filters{padding:1.5rem 1rem .5rem}
  .gallery{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<nav>
  <div class="logo">🏔️ Bassano da Scoprire</div>
  <div class="nav-right">
    <button class="btn-add" onclick="openAddForm()">+ Aggiungi idea</button>
    <button class="btn-theme" data-theme-toggle aria-label="Tema">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>
<div class="hero">
  <h1>Bassano da Scoprire</h1>
  <p>Mangiare, camminare, pedalare, scoprire...</p>
 <!--  <div class="hero-sub">
    <span class="hero-pill">🏔️ Monte Grappa</span>
    <span class="hero-pill">🌉 Ponte degli Alpini</span>
    <span class="hero-pill">🥃 Grappa Nardini</span>
    <span class="hero-pill">🌿 Asparago DOP</span>
  </div> -->
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="all">🗺️ Tutte</button>
  <button class="filter-btn" data-filter="visitare">🏛️ Visitare</button>
  <button class="filter-btn" data-filter="mangiare">🍽️ Mangiare</button>
  <button class="filter-btn" data-filter="prodotti">🧀 Prodotti tipici</button>
  <button class="filter-btn" data-filter="trekking">🥾 Trekking facili</button>
  <button class="filter-btn" data-filter="trekking-medio">🏔️ Trekking medi</button>
  <button class="filter-btn" data-filter="bici">🚲 Giri in bici</button>
  <!-- <button class="filter-btn" data-filter="picnic">🧺 Pic-nic</button>-->
  <button class="filter-btn" data-filter="adventure">🎢 Adventure & Fun</button>
</div>

<div class="grid" id="grid"></div>

<!-- CARD MODAL -->
<div class="overlay" id="cardOverlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal('cardOverlay')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-img"><img id="mImg" src="" alt=""></div>
    <div class="modal-body">
      <div class="modal-cat" id="mCat"></div>
      <h2 class="modal-title" id="mTitle"></h2>
      <p class="modal-desc" id="mDesc"></p>
      <div class="modal-info" id="mInfo"></div>
      <div class="gallery" id="mGallery"></div>
      <div class="highlights-box" id="mHighlights" style="display:none">
        <div class="highlights-label">Da non perdere</div>
        <ul class="highlights-list" id="mHighlightsList"></ul>
      </div>
      <div class="links-box" id="mLinks" style="display:none"></div>
      <div class="modal-actions">
        <button class="modal-like" id="mLikeBtn" onclick="toggleLikeModal()">❤️ <span id="mLikeCount"></span> Mi piace</button>
        <a class="modal-maps" id="mMaps" href="#" target="_blank" rel="noopener">📍 Google Maps</a>
      </div>
    </div>
  </div>
</div>

<!-- ADD FORM MODAL -->
<div class="overlay" id="addOverlay">
  <div class="form-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <div class="form-title" style="margin:0">➕ Nuova idea</div>
      <button class="close-btn" style="position:static;box-shadow:none" onclick="closeModal('addOverlay')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form onsubmit="submitIdea(event)">
      <div class="field"><label>Titolo *</label><input type="text" id="fTitle" placeholder="es. Trattoria da Mario" required></div>
      <div class="field"><label>Categoria *</label>
        <select id="fCat" required>
          <option value="">— scegli —</option>
          <option value="visitare">🏛️ Visitare</option>
          <option value="mangiare">🍽️ Mangiare</option>
          <option value="prodotti">🧀 Prodotti tipici</option>
          <option value="trekking">🥾 Trekking facile</option>
          <option value="trekking-medio">🏔️ Trekking medio</option>
          <option value="bici">🚲 Giro in bici</option>
          <option value="picnic">🧺 Pic-nic</option>
          <option value="adventure">🎢 Adventure & Fun</option>
        </select>
      </div>
      <div class="field"><label>Descrizione</label><textarea id="fDesc" placeholder="Descrivi il posto…"></textarea></div>
      <div class="field"><label>Info (distanza, prezzo, orari…)</label><input type="text" id="fDist" placeholder="es. 12 km · Aperto tutti i giorni"></div>
      <div class="field"><label>Durata / fascia oraria</label><input type="text" id="fDur" placeholder="es. 3h · Pranzo e cena"></div>
      <div class="field"><label>Link Google Maps</label><input type="url" id="fMaps" placeholder="https://maps.google.com/..."></div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="closeModal('addOverlay')">Annulla</button>
        <button type="submit" class="btn-submit">✅ Aggiungi</button>
      </div>
    </form>
  </div>
</div>

<script>
const CAT = {
  'visitare':       { label:'🏛️ Visitare',         badge:'badge-visitare',       text:'text-visitare' },
  'mangiare':       { label:'🍽️ Mangiare',          badge:'badge-mangiare',       text:'text-mangiare' },
  'prodotti':       { label:'🧀 Prodotti tipici',   badge:'badge-prodotti',       text:'text-prodotti' },
  'trekking':       { label:'🥾 Trekking facile',   badge:'badge-trekking',       text:'text-trekking' },
  'trekking-medio': { label:'🏔️ Trekking medio',    badge:'badge-trekking-medio', text:'text-trekking-medio' },
  'bici':           { label:'🚲 Giro in bici',      badge:'badge-bici',           text:'text-bici' },
  'picnic':         { label:'🧺 Pic-nic',           badge:'badge-picnic',         text:'text-picnic' },
  'adventure':      { label:'🎢 Adventure & Fun',   badge:'badge-adventure',      text:'text-adventure' }
};

let ideas = [

  // ── VISITARE ──
  {
    id:1, cat:'visitare', title:'Ponte degli Alpini — il simbolo di Bassano',
    desc:"Il Ponte degli Alpini, progettato da Andrea Palladio nel 1569 e ricostruito più volte, è il simbolo assoluto di Bassano del Grappa. Collega il centro storico alla riva destra del Brenta con la sua struttura in legno coperta. Monumento nazionale dal 2019, è il luogo ideale da cui ammirare il fiume e i monti sullo sfondo. Ai suoi piedi si trovano le celebri grapperie Nardini, aperte dal 1779.",
    dist:'Centro storico', dur:'30 min', diff:'Facile',
    img:'pontealpini/copertina.jpg',
    gallery:['pontealpini/foto1.jpg','pontealpini/foto2.jpg'],
    maps:'https://maps.google.com/?q=Ponte+degli+Alpini+Bassano+del+Grappa',
    highlights:[
      '🌉 Progettato da Andrea Palladio nel 1569',
      '🥃 Grapperia Nardini ai piedi del ponte — aperta dal 1779',
      '📸 Vista panoramica sul fiume Brenta e le Prealpi',
      '🎖️ Monumento nazionale dal 2019',
      '🚶 Punto di partenza ideale per il centro storico'
    ],
    links:[
      { label:'🏛️ Visit Bassano', url:'https://www.visitbassano.it' }
    ],
    tags:['Centro storico','Palladio','Grappa','Icona'], likes:8
  },

  desc:"In Veneto il bacalà non è solo un piatto: è identità. Attenzione: qui lo chiamano Bacalà (con una sola c), perché si tratta di stoccafisso — merluzzo artico essiccato all\'aria — non del merluzzo sotto sale. La storia inizia nel 1432 quando il mercante veneziano Pietro Querini naufragò a Røst, nelle Isole Lofoten in Norvegia, e scoprì lo stoccafisso. Tornato a Venezia lo introdusse nella cucina veneta e nacque una storia d\'amore lunga 600 anni. Il comune di Sandrigo (VI) è ancora oggi gemellato con l\'isola norvegese di Røst, che fornisce il 90% dello stoccafisso trasformato in bacalà alla vicentina — circa 2 milioni di chili l\'anno. Il piatto simbolo è il Bacalà alla Vicentina: lo stoccafisso ammollato per giorni, poi cotto lentissimamente nel latte con cipolla, acciughe, olio e prezzemolo per almeno 4 ore. Servito rigorosamente con polenta bianca. Ogni famiglia e ogni osteria ha la propria ricetta segreta. Il Baccalà Mantecato è invece la variante veneziana: montato con olio fino a diventare una crema vellutata da spalmare sul pane tostato.",

let likes = {};
let currentId = null;
let activeFilter = 'all';

try {
  const saved = localStorage.getItem('bs_likes');
  if(saved) likes = JSON.parse(saved);
  const savedIdeas = localStorage.getItem('bs_ideas');
  if(savedIdeas) ideas = ideas.concat(JSON.parse(savedIdeas));
} catch(e){}

function saveLikes(){ try{ localStorage.setItem('bs_likes', JSON.stringify(likes)); }catch(e){} }

function imgUrl(src){
  if(!src) return 'https://picsum.photos/seed/bassano-default/640/360';
  if(src.startsWith('http') || src.includes('/')) return src;
  return 'https://picsum.photos/seed/'+src+'/640/360';
}

function renderGrid(){
  const filtered = ideas.filter(i => activeFilter==='all' || i.cat===activeFilter);
  const grid = document.getElementById('grid');
  if(!filtered.length){
    grid.innerHTML='<div class="empty"><div class="empty-icon">🏔️</div><p>Nessuna scheda in questa categoria.<br>Aggiungila tu!</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(idea => {
    const c = CAT[idea.cat] || CAT['visitare'];
    const liked = !!likes[idea.id];
    const likeCount = (idea.likes||0) + (liked?1:0);
    return `
    <div class="card" onclick="openCard(${idea.id})">
      <div class="card-img">
        <img src="${imgUrl(idea.img)}" alt="${idea.title}" width="640" height="360" loading="lazy">
        <div class="cat-badge ${c.badge}">${c.label}</div>
      </div>
      <div class="card-body">
        <div class="card-cat ${c.text}">${c.label}</div>
        <div class="card-title">${idea.title}</div>
        <div class="card-desc">${idea.desc}</div>
        <div class="card-footer">
          <div class="card-meta">
            ${idea.dist?`<span class="tag">📍 ${idea.dist}</span>`:''}
            ${idea.dur?`<span class="tag">⏱ ${idea.dur}</span>`:''}
          </div>
          <button class="like-btn ${liked?'liked':''}" onclick="event.stopPropagation();toggleLike(${idea.id},this)">
            <span class="heart">${liked?'❤️':'🤍'}</span>
            <span class="like-num">${likeCount}</span>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleLike(id, btn){
  likes[id] = !likes[id];
  saveLikes();
  const idea = ideas.find(i=>i.id===id);
  const count = (idea.likes||0) + (likes[id]?1:0);
  btn.querySelector('.heart').textContent = likes[id]?'❤️':'🤍';
  btn.querySelector('.like-num').textContent = count;
  btn.classList.toggle('liked', !!likes[id]);
  if(currentId===id){
    document.getElementById('mLikeBtn').classList.toggle('liked', !!likes[id]);
    document.getElementById('mLikeCount').textContent = count;
  }
}

function toggleLikeModal(){
  const btn = document.querySelector(`.card[onclick="openCard(${currentId})"] .like-btn`);
  if(btn){ toggleLike(currentId, btn); return; }
  likes[currentId] = !likes[currentId];
  saveLikes();
  const idea = ideas.find(i=>i.id===currentId);
  const count = (idea.likes||0)+(likes[currentId]?1:0);
  document.getElementById('mLikeBtn').classList.toggle('liked',!!likes[currentId]);
  document.getElementById('mLikeCount').textContent = count;
  renderGrid();
}

function openCard(id){
  const idea = ideas.find(i=>i.id===id);
  if(!idea) return;
  currentId = id;
  const c = CAT[idea.cat] || CAT['visitare'];
  const liked = !!likes[id];
  const count = (idea.likes||0)+(liked?1:0);
  document.getElementById('mImg').src = imgUrl(idea.img);
  document.getElementById('mImg').alt = idea.title;
  document.getElementById('mCat').className = 'modal-cat '+c.text;
  document.getElementById('mCat').textContent = c.label;
  document.getElementById('mTitle').textContent = idea.title;
  document.getElementById('mDesc').textContent = idea.desc;
  document.getElementById('mInfo').innerHTML = [
    idea.dist?`<span class="info-chip">📍 ${idea.dist}</span>`:'',
    idea.dur?`<span class="info-chip">⏱ ${idea.dur}</span>`:'',
    idea.diff&&idea.diff!=='—'?`<span class="info-chip">💪 ${idea.diff}</span>`:'',
    ...(idea.tags||[]).map(t=>`<span class="info-chip">${t}</span>`)
  ].join('');
  const gallery = document.getElementById('mGallery');
  if(idea.gallery && idea.gallery.length){
    gallery.style.display='grid';
    gallery.innerHTML = idea.gallery.map(f=>
      `<img src="${imgUrl(f)}" alt="foto" loading="lazy" onclick="window.open('${f}','_blank')">`
    ).join('');
  } else {
    gallery.style.display='none'; gallery.innerHTML='';
  }
  const hlBox = document.getElementById('mHighlights');
  const hlList = document.getElementById('mHighlightsList');
  if(idea.highlights && idea.highlights.length){
    hlBox.style.display='block';
    hlList.innerHTML = idea.highlights.map(h=>`<li>${h}</li>`).join('');
  } else { hlBox.style.display='none'; }
  const linksBox = document.getElementById('mLinks');
  if(idea.links && idea.links.length){
    linksBox.style.display='flex';
    linksBox.innerHTML = idea.links.map(l=>
      `<a class="link-chip" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`
    ).join('');
  } else { linksBox.style.display='none'; }
  document.getElementById('mLikeBtn').classList.toggle('liked', liked);
  document.getElementById('mLikeCount').textContent = count;
  const a = document.getElementById('mMaps');
  if(idea.maps){ a.href=idea.maps; a.style.display='flex'; }
  else { a.style.display='none'; }
  document.getElementById('cardOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow='';
}

document.getElementById('cardOverlay').addEventListener('click',function(e){if(e.target===this)closeModal('cardOverlay');});
document.getElementById('addOverlay').addEventListener('click',function(e){if(e.target===this)closeModal('addOverlay');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('cardOverlay');closeModal('addOverlay');}});

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter=btn.dataset.filter;
    renderGrid();
  });
});

function openAddForm(){
  document.getElementById('addOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function submitIdea(e){
  e.preventDefault();
  const title=document.getElementById('fTitle').value.trim();
  const cat=document.getElementById('fCat').value;
  if(!title||!cat) return;
  const newIdea={
    id:Date.now(), cat, title,
    desc:document.getElementById('fDesc').value.trim()||'Nessuna descrizione.',
    dist:document.getElementById('fDist').value.trim(),
    dur:document.getElementById('fDur').value.trim(),
    diff:'—', img:'bassano-new-idea',
    maps:document.getElementById('fMaps').value.trim(),
    tags:[], likes:0
  };
  ideas.push(newIdea);
  try{
    const saved=JSON.parse(localStorage.getItem('bs_ideas')||'[]');
    saved.push(newIdea);
    localStorage.setItem('bs_ideas',JSON.stringify(saved));
  }catch(ex){}
  closeModal('addOverlay');
  e.target.reset();
  renderGrid();
}

(function(){
  const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
  let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  r.setAttribute('data-theme',d);
  t&&t.addEventListener('click',()=>{
    d=d==='dark'?'light':'dark';
    r.setAttribute('data-theme',d);
    t.innerHTML=d==='dark'
      ?'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  });
})();

renderGrid();
</script>
